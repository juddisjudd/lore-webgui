services:
  lore-webgui:
    image: ghcr.io/juddisjudd/lore-webgui:latest
    build: .
    ports:
      - "${PORT:-7337}:7337"
    environment:
      LORE_HOST: ${LORE_HOST:-host.docker.internal}
      LORE_TOKEN: ${LORE_TOKEN:-}
    volumes:
      - lore-webgui-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  lore-webgui-data:
