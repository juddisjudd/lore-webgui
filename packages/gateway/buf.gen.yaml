version: v2
inputs:
  - directory: ../../../lore/lore-proto/proto
    paths:
      - ../../../lore/lore-proto/proto/lore/model/v1
      - ../../../lore/lore-proto/proto/lore/repository/v1
      - ../../../lore/lore-proto/proto/lore/revision/v1
      - ../../../lore/lore-proto/proto/lore/thin_client/v1
      - ../../../lore/lore-proto/proto/lore/environment/v1
      - ../../../lore/lore-proto/proto/lock.proto
      - ../../../lore/lore-proto/proto/model.proto
      - ../../../lore/lore-proto/proto/lore_notification.proto
plugins:
  - local: ["bun", "node_modules/@bufbuild/protoc-gen-es/bin/protoc-gen-es"]
    out: src/gen
    opt:
      - target=ts
      - import_extension=ts
clean: true
